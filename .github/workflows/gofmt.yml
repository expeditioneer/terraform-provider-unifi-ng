name: gofmt

on:
  pull_request:
  push:

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod
      - run: |
          gofmt -d . | tee gofmt.diff
          test ! -s gofmt.diff
